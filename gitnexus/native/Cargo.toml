[package]
name = "gitnexus-core"
version = "0.1.0"
edition = "2021"
description = "Native parser core for GitNexus — tree-sitter symbol extraction via napi-rs"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi8"] }
napi-derive = "2"
tree-sitter = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-java = "0.23"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-go = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-php = "0.23"
tree-sitter-kotlin-ng = "1.1"
# tree-sitter-swift requires ABI v15, incompatible with tree-sitter 0.24; re-enable with ts 0.25+
rustc-hash = "2"
rayon = "1.10"

[build-dependencies]
napi-build = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
